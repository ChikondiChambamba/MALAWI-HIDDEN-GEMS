<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15120e">
  <title>Offline | Malawi Hidden Gems</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="site-header__bar">
        <a href="/" class="brand">
          <span class="brand__mark"><img src="/images/logo.png" alt="" width="52" height="52"></span>
          <span>
            <span class="brand__name">Malawi Hidden Gems</span>
            <span class="brand__tag">Stories from the warm heart of Africa</span>
          </span>
        </a>
      </div>
    </div>
  </header>
  <main class="site-main container">
    <section class="status-page">
      <div class="status-sun" aria-hidden="true"></div>
      <p class="eyebrow">Offline mode</p>
      <h1 class="display-lg">You are offline right now.</h1>
      <p class="lede">Stories you have already opened are still available. As soon as your connection returns, fresh content will load again.</p>
      <div class="btn-row">
        <a href="/" class="btn btn--primary">Try the homepage again</a>
      </div>
    </section>
  </main>
</body>
</html>
